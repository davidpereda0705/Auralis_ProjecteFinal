<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auralis: El Despertar - Mundo</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/juego.css">
</head>
<body class="juego-page">
    
    <!-- CONTENEDOR 3D -->
    <div id="game-viewport">
        <canvas id="three-canvas"></canvas>
    </div>

    <!-- HUD SUPERIOR -->
    <div id="hud">
        <div class="hud-item">
            <span class="hud-label">OBJETIVO</span>
            <span class="hud-value">Encuentra al Maestro del Domo</span>
        </div>
    </div>

    <!-- CAJA DE DIÁLOGO -->
    <div id="caja-dialogo" class="hidden">
        <span class="texto-dialogo"></span>
        <div class="dialogo-hint">[E] continuar</div>
    </div>

    <!-- MENÚ DE COMBATE (se mantiene para más adelante) -->
    <div id="battle-overlay" class="hidden">
        <div class="battle-box">
            <h2 id="battle-title">¡Un Auralis Salvaje!</h2>
            <div id="battle-sprite" class="sprite-float">⚡</div>
            <p id="battle-text">¿Quieres luchar contra este Auralis?</p>
            <div class="battle-actions">
                <button id="btn-fight" class="action-btn">¡LUCHAR!</button>
                <button id="btn-run" class="action-btn btn-red">HUIR</button>
            </div>
        </div>
    </div>

    <!-- PANTALLA DE VICTORIA -->
    <div id="victory-overlay" class="hidden">
        <div class="victory-box">
            <h1>¡VICTORIA!</h1>
            <p>Has derrotado al Auralis salvaje.</p>
            <button id="btn-return-menu" class="action-btn btn-blue">VOLVER AL MENÚ</button>
        </div>
    </div>

    <!-- COPYRIGHT -->
    <div class="copyright">© 2026 Auralis Team · v1.0</div>

    <!-- THREE.JS PRIMERO -->
    <script src="js/three.min.js"></script>
    <!-- MAIN (audio global) -->
    <script src="js/main.js"></script>
    <!-- LÓGICA DEL JUEGO 3D -->
    <script src="js/juego.js"></script>
</body>
</html>
