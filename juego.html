<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auralis: El Despertar - Mundo</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/juego.css">
</head>
<body class="juego-page">
    
    <!-- CONTENEDOR 3D -->
    <div id="game-viewport">
        <canvas id="three-canvas"></canvas>
    </div>

    <!-- HUD SUPERIOR -->
    <div id="hud">
        <div class="hud-item">
            <span class="hud-label">OBJETIVO</span>
            <span class="hud-value">Encuentra al Maestro del Domo</span>
        </div>
    </div>

    <!-- CAJA DE DIÁLOGO -->
    <div id="caja-dialogo" class="hidden">
        <span class="texto-dialogo"></span>
        <div class="dialogo-hint">[E] continuar</div>
    </div>

    <!-- BOTÓN VOLVER AL MENÚ -->
    <div id="btn-volver-menu-juego" style="position: fixed; top: 20px; right: 20px; z-index: 999;">
        <button style="background: #e63946; color: white; border: 4px solid #1c3a6e; border-radius: 8px; padding: 10px 20px; font-family: 'Press Start 2P', monospace; font-size: 0.7rem; cursor: pointer; box-shadow: 0 4px 0 #0f2342;" onclick="window.location.href='index.html'">
            MENÚ
        </button>
    </div>

    <!-- MENÚ DE COMBATE -->
    <div id="battle-overlay" class="hidden">
        <div class="battle-box">
            <h2 id="battle-title">¡Un Auralis Salvaje!</h2>
            <div id="battle-sprite" class="sprite-float">⚡</div>
            <p id="battle-text">¿Quieres luchar contra este Auralis?</p>
            <div class="battle-actions">
                <button id="btn-fight" class="action-btn">¡LUCHAR!</button>
                <button id="btn-run" class="action-btn btn-red">HUIR</button>
            </div>
        </div>
    </div>

    <!-- PANTALLA DE VICTORIA -->
    <div id="victory-overlay" class="hidden">
        <div class="victory-box">
            <h1>¡VICTORIA!</h1>
            <p>Has derrotado al Auralis salvaje.</p>
            <button id="btn-return-menu" class="action-btn btn-blue">VOLVER AL MENÚ</button>
        </div>
    </div>

    <!-- MENÚ DE PAUSA (ESC) -->
    <div id="menu-pausa" class="hidden">
        <div class="pausa-box">
            <h1>PAUSA</h1>
            <div class="pausa-botones">
                <button id="btn-pausa-continuar" class="action-btn">CONTINUAR</button>
                <button id="btn-pausa-guardar" class="action-btn btn-blue">GUARDAR Y SALIR</button>
                <button id="btn-pausa-salir" class="action-btn btn-red">SALIR SIN GUARDAR</button>
            </div>
        </div>
    </div>

    <!-- COPYRIGHT -->
    <div class="copyright">© 2026 Auralis Team · v1.0</div>

    <!-- SCRIPTS -->
    <script src="js/three.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/interiores.js"></script>
    <script src="js/juego.js"></script>
</body>
</html>
